services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=ClimaFlow_StrongPass1!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-U", "sa", "-P", "ClimaFlow_StrongPass1!", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 4G

  climaflow-api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - "ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ClimaFlowDb;User Id=sa;Password=ClimaFlow_StrongPass1!;TrustServerCertificate=True;MultipleActiveResultSets=true"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.3'
          memory: 256M


  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - climaflow-api